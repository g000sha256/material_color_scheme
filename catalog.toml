[versions]
android = "8.13.0"
annotations = "26.0.2"
binaryCompatibilityValidator = "0.18.1"
compose = "1.9.0"
composeMaterial = "1.8.2"
dokka = "2.0.0"
kotlin = "2.2.20"
materialKolor = "3.0.1"
sonatypeMavenCentral = "1.1.1"

[plugins]
android = { id = "com.android.library", version.ref = "android" }
g000sha256-sonatypeMavenCentral = { id = "dev.g000sha256.sonatype-maven-central", version.ref = "sonatypeMavenCentral" }
gradle-mavenPublish = { id = "org.gradle.maven-publish" }
gradle-signing = { id = "org.gradle.signing" }
jetBrains-binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
jetBrains-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetBrains-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
jetBrains-kotlin = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

[libraries]
libraries-compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose" }
libraries-compose-animationCore = { module = "org.jetbrains.compose.animation:animation-core", version.ref = "compose" }
libraries-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial" }
libraries-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
libraries-compose-uiGraphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose" }
libraries-jetBrains-annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
libraries-jetBrains-kotlin = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
libraries-materialColorUtilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialKolor" }
test-kotlin = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
